<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Treino+</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --label: #000000;
      --secondary: #8E8E93;
      --separator: #C6C6C8;
      --fill: #E5E5EA;
      --blue: #007AFF;
      --tab-bg: rgba(249, 249, 249, 0.92);
      --radius: 14px;
      --radius-sm: 12px;
      --app-max: 430px;
      --tab-h: 49px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { background: #FFFFFF; }
    body {
      font-family: var(--font);
      background: #FFFFFF;
      color: var(--label);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    button {
      font-family: inherit; color: inherit; background: none; border: none;
      cursor: pointer; text-align: left; appearance: none; -webkit-appearance: none;
    }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .app {
      width: 100%; max-width: var(--app-max); margin: 0 auto;
      min-height: 100dvh; background: var(--bg); position: relative;
    }
    .screen {
      display: none;
      padding: calc(8px + var(--safe-top)) 0 calc(var(--tab-h) + var(--safe-bottom) + 28px);
      animation: appear 0.22s ease;
    }
    .screen.active { display: block; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .header { padding: 6px 20px 12px; }
    .large-title {
      font-size: 34px; font-weight: 700; letter-spacing: 0.37px; line-height: 1.12;
    }
    .header-sub {
      margin-top: 6px; font-size: 15px; line-height: 1.35; color: var(--secondary);
    }
    .nav {
      display: flex; align-items: center; min-height: 44px; padding: 0 8px; position: relative;
    }
    .nav-back {
      display: flex; align-items: center; gap: 2px; color: var(--blue);
      font-size: 17px; padding: 8px 8px 8px 4px; min-height: 44px; z-index: 1;
    }
    .nav-back svg { width: 12px; height: 20px; flex-shrink: 0; }
    .nav-title {
      position: absolute; left: 56px; right: 56px; text-align: center;
      font-size: 17px; font-weight: 600; pointer-events: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sec {
      font-size: 20px; font-weight: 700; letter-spacing: -0.3px; padding: 22px 20px 12px;
    }
    .sec.sm {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--secondary); padding: 20px 20px 10px;
    }

    .hero {
      margin: 0 16px; border-radius: 18px; overflow: hidden; position: relative;
      min-height: 200px; display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: var(--shadow);
    }
    .hero:active { transform: scale(0.985); }
    .hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(255,255,255,0.25), transparent 50%),
        linear-gradient(160deg, #1C1C1E 0%, #2C2C2E 40%, #007AFF 160%);
    }
    .hero-body { position: relative; z-index: 1; padding: 20px; color: #fff; }
    .hero-kicker {
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; opacity: 0.8; margin-bottom: 6px;
    }
    .hero-title { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.15; }
    .hero-meta { margin-top: 8px; font-size: 14px; opacity: 0.85; }
    .hero-art {
      position: absolute; right: -8px; top: 8px; width: 130px; height: 180px;
      opacity: 0.9; pointer-events: none;
    }
    .hero-art svg { width: 100%; height: 100%; }

    .rail {
      display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail-card {
      flex: 0 0 148px; scroll-snap-align: start; background: var(--card);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); min-height: 44px;
    }
    .rail-card:active { opacity: 0.88; }
    .rail-card .thumb {
      height: 88px; position: relative; display: flex; align-items: center; justify-content: center;
    }
    .rail-card .thumb svg { width: 56px; height: 100px; }
    .rail-card .info { padding: 10px 12px 12px; }
    .rail-card .info strong { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; }
    .rail-card .info span { display: block; font-size: 12px; color: var(--secondary); margin-top: 3px; }

    .body-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px;
    }
    .body-card {
      background: var(--card); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); min-height: 44px;
    }
    .body-card:active { transform: scale(0.98); }
    .body-visual {
      height: 132px; position: relative; display: flex; align-items: flex-end;
      justify-content: center; padding-bottom: 4px;
    }
    .body-visual svg { width: 72px; height: 124px; }
    .body-card .label {
      padding: 10px 12px 14px; font-size: 15px; font-weight: 600; text-align: center;
    }
    .body-card .label span {
      display: block; font-size: 12px; font-weight: 400; color: var(--secondary); margin-top: 2px;
    }

    .tone-a { background: linear-gradient(165deg, #E8EEF6, #D6E4F5); }
    .tone-b { background: linear-gradient(165deg, #E9E9F0, #D8D8E8); }
    .tone-c { background: linear-gradient(165deg, #E8F0F4, #D2E5EE); }
    .tone-d { background: linear-gradient(165deg, #EEEAF4, #DDD4EC); }
    .tone-e { background: linear-gradient(165deg, #EAF0F0, #D4E4E4); }
    .tone-f { background: linear-gradient(165deg, #F2EAE8, #E8D6D2); }
    .tone-g { background: linear-gradient(165deg, #EAF0EA, #D4E4D6); }
    .tone-h { background: linear-gradient(165deg, #E8ECF4, #C8D6F0); }
    .tone-i { background: linear-gradient(165deg, #F0EEE8, #E4DED0); }
    .tone-fast { background: linear-gradient(165deg, #1C1C1E, #3A3A3C); }
    .tone-run5 { background: linear-gradient(155deg, #0A84FF22, #5AC8FA44), linear-gradient(165deg, #E8F4FC, #C8E4F8); }
    .tone-run10 { background: linear-gradient(155deg, #5856D622, #AF52DE33), linear-gradient(165deg, #EEE8F8, #D8D0F0); }

    .feature-tile {
      margin: 0 16px 12px; border-radius: var(--radius); overflow: hidden;
      background: var(--card); box-shadow: var(--shadow);
      display: grid; grid-template-columns: 108px 1fr; min-height: 100px;
    }
    .feature-tile:active { opacity: 0.9; }
    .feature-tile .art {
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .feature-tile .art svg { width: 64px; height: 110px; }
    .feature-tile .body {
      padding: 14px 14px 14px 4px; display: flex; flex-direction: column; justify-content: center;
    }
    .feature-tile .body strong { font-size: 17px; font-weight: 650; letter-spacing: -0.2px; }
    .feature-tile .body p { font-size: 13px; color: var(--secondary); margin-top: 4px; line-height: 1.3; }
    .badge {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 100px; background: rgba(0,122,255,0.12);
      color: var(--blue); margin-bottom: 6px; width: fit-content;
    }
    .badge.green { background: rgba(52,199,89,0.14); color: #248A3D; }
    .badge.orange { background: rgba(255,149,0,0.16); color: #C93400; }

    .proto-card {
      margin: 0 16px 12px; border-radius: 18px; overflow: hidden;
      background: var(--card); box-shadow: var(--shadow); min-height: 44px;
    }
    .proto-card:active { transform: scale(0.985); }
    .proto-cover {
      height: 120px; position: relative; padding: 16px; color: #fff;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .proto-cover.inter { background: linear-gradient(135deg, #1C3A5F 0%, #007AFF 100%); }
    .proto-cover.adv { background: linear-gradient(135deg, #2C1F4A 0%, #5856D6 100%); }
    .proto-cover .kicker {
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; opacity: 0.85; margin-bottom: 4px;
    }
    .proto-cover h3 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .proto-meta { display: flex; gap: 8px; padding: 12px 16px 14px; flex-wrap: wrap; }
    .chip {
      font-size: 12px; font-weight: 500; color: var(--secondary);
      background: var(--fill); padding: 5px 10px; border-radius: 100px;
    }
    .chip.accent { background: rgba(0,122,255,0.12); color: var(--blue); }

    .workout-card {
      margin: 0 16px 10px; background: var(--card); border-radius: var(--radius-sm);
      box-shadow: var(--shadow); display: grid; grid-template-columns: 72px 1fr;
      align-items: center; gap: 12px; padding: 10px; min-height: 72px; width: calc(100% - 32px);
    }
    .workout-card:active { opacity: 0.88; }
    .workout-thumb {
      width: 72px; height: 72px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; position: relative;
      overflow: hidden;
    }
    .workout-thumb svg { width: 40px; height: 68px; }
    .workout-thumb .play {
      position: absolute; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.92); display: flex; align-items: center;
      justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .workout-thumb .play svg { width: 12px; height: 12px; margin-left: 1px; color: var(--label); }
    .workout-info strong { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; }
    .workout-info span { display: block; font-size: 13px; color: var(--secondary); margin-top: 3px; }

    .run-card {
      margin: 0 16px 14px; border-radius: 18px; overflow: hidden;
      background: var(--card); box-shadow: var(--shadow); min-height: 44px; width: calc(100% - 32px);
    }
    .run-card:active { transform: scale(0.985); }
    .run-visual {
      height: 140px; position: relative; padding: 16px 18px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .run-visual .dist {
      font-size: 42px; font-weight: 700; letter-spacing: -1px; line-height: 1; color: var(--label);
