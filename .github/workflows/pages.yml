name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f chunks/MANIFEST.txt ]; then
            echo "Assembling site from base64 chunks..."
            cat chunks/part-*.b64 | tr -d '\n' | base64 -d > /tmp/site.tar.gz
            tar -xzf /tmp/site.tar.gz -C _site
            expected=$(awk -F= '/gzip_sha256/{print $2}' chunks/MANIFEST.txt)
            actual=$(sha256sum /tmp/site.tar.gz | awk '{print $1}')
            echo "expected=$expected actual=$actual"
            test "$expected" = "$actual"
          elif [ -d _next ] && [ -f index.html ]; then
            rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='chunks' --exclude='site-encoded' --exclude='assets' ./ _site/
          else
            echo "No site payload found" >&2
            exit 1
          fi
          touch _site/.nojekyll
          test -f _site/index.html
          test -d _site/_next
          grep -q "Treino Live" _site/index.html
          grep -q "treino-plus-preview/_next" _site/index.html
          wc -c _site/index.html
          find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
