name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Deploy committed Next static export at repo root.
          # Exclude legacy trainer-preview assemble dirs if still present.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='chunks' \
            --exclude='site-encoded' \
            --exclude='assets' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -d _site/_next
          grep -q "Treino Live" _site/index.html
          grep -q "treino-plus-preview/_next" _site/index.html
          wc -c _site/index.html
          find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
