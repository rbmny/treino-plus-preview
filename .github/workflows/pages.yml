name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout treino-live (public source)
        uses: actions/checkout@v4
        with:
          repository: rbmny/treino-live
          path: app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and static-export
        working-directory: app
        run: |
          set -euo pipefail
          if [ -d src/app/api ]; then
            mkdir -p _api_server_only
            mv src/app/api _api_server_only/api || true
          fi
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f out/index.html
          test -d out/_next
          grep -q "Treino Live" out/index.html
          grep -q "treino-plus-preview/_next" out/index.html
          touch out/.nojekyll
          wc -c out/index.html
          find out -type f | wc -l

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a app/out/ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
